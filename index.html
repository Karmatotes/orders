<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarmaTotes — New Order</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EDE6;--surface:#FDFAF6;--bark:#2C1F14;--moss:#3B6B45;--moss-light:#5A9467;--clay:#C05A2A;--sand:#D4A96A;--cream:#EDE5D8;--red:#C0392B;--red-soft:#FAE9E7;--green-soft:#EAF4EC;--border:rgba(44,31,20,0.12);--shadow:0 2px 12px rgba(44,31,20,0.10);--shadow-lg:0 8px 32px rgba(44,31,20,0.15);--blue-soft:#EFF6FF;--blue:#1D4ED8;--purple-soft:#FDF4FF;--purple:#7E22CE;}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--bark);min-height:100vh}.sync-bar{background:var(--bark);color:rgba(255,255,255,0.7);padding:3px 24px;font-size:11px;font-family:'DM Mono',monospace;display:flex;align-items:center;gap:8px;height:24px;position:sticky;top:0;z-index:101}.sync-dot{width:7px;height:7px;border-radius:50%;background:#9CA3AF;flex-shrink:0;transition:background .3s}.sync-dot.syncing{background:#F59E0B;animation:pulse .8s infinite}.sync-dot.ok{background:#22C55E}.sync-dot.err{background:#EF4444}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.sync-text{flex:1}.sync-time{opacity:.5;font-size:10px}header{background:var(--bark);color:#fff;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:24px;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.25)}.logo{display:flex;align-items:center;gap:10px}.logo-mark{width:34px;height:34px;background:var(--moss);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}.logo h1{font-size:17px;font-weight:700;letter-spacing:-.3px}.logo span{font-size:12px;color:rgba(255,255,255,0.5);font-weight:400}.header-right{display:flex;align-items:center;gap:10px}.date-badge{background:rgba(255,255,255,0.1);border-radius:6px;padding:4px 10px;font-size:12px;font-family:'DM Mono',monospace;color:rgba(255,255,255,0.75)}.btn-tracker{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all .15s}.btn-tracker:hover{background:rgba(255,255,255,0.22)}.nav-tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0}.nav-tab{padding:12px 18px;font-size:13px;font-weight:500;color:rgba(44,31,20,0.5);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}.nav-tab.active{color:var(--moss);border-bottom-color:var(--moss);font-weight:600}.nav-tab:hover:not(.active){color:var(--bark)}.page{display:none;padding:24px}.page.active{display:block}.form-card{background:var(--surface);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);max-width:720px;margin:0 auto;overflow:hidden}.form-card-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}.form-card-icon{width:38px;height:38px;border-radius:9px;background:var(--moss);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.form-card-title{font-size:16px;font-weight:700;color:var(--bark)}.form-card-sub{font-size:12px;color:rgba(44,31,20,0.5);margin-top:2px}.form-card-body{padding:24px}.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:rgba(44,31,20,0.4);margin-bottom:12px;margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--border)}.section-label:first-child{margin-top:0}.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;font-weight:600;color:rgba(44,31,20,0.6);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}.form-group label .req{color:var(--red);margin-left:2px}.form-control{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--bark);outline:none;transition:border-color .15s}.form-control:focus{border-color:var(--moss);background:var(--surface)}.form-control::placeholder{color:rgba(44,31,20,0.3)}.form-hint{font-size:11px;color:rgba(44,31,20,0.4);margin-top:4px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}select.form-control{cursor:pointer}textarea.form-control{resize:none}.print-type-wrap{display:flex;gap:8px;flex-wrap:wrap}.print-type-btn{flex:1;min-width:80px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;background:var(--surface);color:rgba(44,31,20,0.6)}.print-type-btn.active-none{border-color:var(--bark);background:var(--bark);color:#fff}.print-type-btn.active-screen{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}.print-type-btn.active-dtf{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}.sale-by-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.sale-by-btn{padding:9px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;background:var(--surface);color:rgba(44,31,20,0.6)}.sale-by-btn.active{border-color:var(--moss);background:var(--green-soft);color:var(--moss)}.feature-grid{display:flex;flex-wrap:wrap;gap:7px}.feature-chip{padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;background:var(--surface);color:rgba(44,31,20,0.6);user-select:none}.feature-chip.active{border-color:var(--moss);background:var(--green-soft);color:var(--moss)}.person-input-row{display:flex;gap:8px;align-items:center}.person-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--bark);outline:none;transition:border-color .15s}.person-input:focus{border-color:var(--moss)}.btn-add-person{background:var(--moss);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer}.person-tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ptag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500}.ptag.worker{background:#EEF2FF;color:#3730A3}.ptag-x{cursor:pointer;opacity:.6;font-size:11px}.ptag-x:hover{opacity:1}.secondary-material-wrap{display:none;margin-top:10px;padding:10px 12px;background:var(--cream);border-radius:8px;border:1px solid var(--border)}.secondary-material-wrap.visible{display:block}.btn-submit{width:100%;background:var(--moss);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;margin-top:20px;letter-spacing:.2px}.btn-submit:hover{background:var(--moss-light)}.btn-submit:disabled{opacity:.5;cursor:not-allowed}.success-screen{display:none;text-align:center;padding:40px 24px}.success-screen.visible{display:block}.success-icon{font-size:48px;margin-bottom:16px}.success-title{font-size:20px;font-weight:700;color:var(--moss);margin-bottom:8px}.success-sub{font-size:13px;color:rgba(44,31,20,0.6);margin-bottom:24px;line-height:1.6}.success-order-card{background:var(--cream);border-radius:10px;padding:16px;text-align:left;margin-bottom:20px;border:1px solid var(--border)}.success-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}.success-row:last-child{border-bottom:none}.success-row label{color:rgba(44,31,20,0.5);font-weight:500}.success-row span{font-weight:600;color:var(--bark);text-align:right;max-width:60%}.btn-new-order{background:var(--moss);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-right:10px}.btn-view-tracker{background:var(--surface);color:var(--bark);border:1.5px solid var(--border);border-radius:10px;padding:12px 24px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.gsm-wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.gsm-select{flex:1;min-width:100px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--bark);outline:none;transition:border-color .15s}.gsm-select:focus{border-color:var(--moss);background:var(--surface)}.gsm-custom-input{width:90px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--bark);outline:none;display:none}.gsm-custom-input.visible{display:block}.gsm-unit{font-size:11px;font-weight:600;color:rgba(44,31,20,0.4);font-family:'DM Mono',monospace}.fabric-detail-wrap{display:none;margin-top:10px;padding:10px 12px;background:var(--cream);border-radius:8px;border:1px solid var(--border);flex-direction:column;gap:8px}.fabric-detail-wrap.visible{display:flex}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bark);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s;white-space:nowrap}.toast.show{transform:translateX(-50%) translateY(0)}.balance-display{margin-top:8px;padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;display:none}.balance-display.visible{display:block}.balance-display.positive{background:var(--green-soft);color:var(--moss)}.stock-alert{margin-top:6px;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;display:none}.stock-alert.visible{display:block}.stock-alert.ok{background:var(--green-soft);color:var(--moss)}.stock-alert.danger{background:var(--red-soft);color:var(--red)}
</style>
</head>
<body>

<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <span class="sync-text" id="sync-text">Connecting…</span>
  <span class="sync-time" id="sync-time"></span>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">🧺</div>
    <div><h1>KarmaTotes</h1><span>Master Entry · Sales</span></div>
  </div>
  <div class="header-right">
    <div class="date-badge" id="live-date"></div>
    <a href="https://karmatotes.github.io/tracker/" target="_blank" class="btn-tracker">⊞ Production</a>
  </div>
</header>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="switchTab('entry')">＋ New Order</div>
  <div class="nav-tab" onclick="switchTab('overview')">📋 Overview</div>
</div>

<div class="page active" id="page-entry">
<div class="form-card" style="margin-top:24px">
  <div class="form-card-header">
    <div class="form-card-icon">📦</div>
    <div>
      <div class="form-card-title">New Order Entry</div>
      <div class="form-card-sub">Saved to Google Sheets · Stock deducted automatically</div>
    </div>
  </div>

  <div class="form-card-body" id="form-body">
    <div class="section-label">Order Info</div>
    <div class="form-group">
      <label>Client <span class="req">*</span></label>
      <input class="form-control" id="f-client" placeholder="e.g. Unity College">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Product</label>
        <select class="form-control" id="f-product"></select>
      </div>
      <div class="form-group">
        <label>Quantity <span class="req">*</span></label>
        <input class="form-control" id="f-qty" type="number" placeholder="150" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Delivery Date <span class="req">*</span></label>
        <input class="form-control" id="f-date" type="date">
      </div>
      <div class="form-group">
        <label>Order Value ₹ <span class="req">*</span></label>
        <input class="form-control" id="f-order-value" type="number" placeholder="15000" min="0">
      </div>
    </div>

    <div class="section-label">Bag Specifications</div>
    <div class="form-row">
      <div class="form-group">
        <label>Primary Material <span class="req">*</span></label>
        <select class="form-control" id="f-primary-material" onchange="onPrimaryMaterialChange()">
          <option value="">Select material…</option>
          <option value="Jute Fabric">Jute Fabric</option>
          <option value="Cotton Canvas">Cotton Canvas</option>
          <option value="Juco Fabric">Juco Fabric</option>
          <option value="Kadhi Fabric">Kadhi Fabric</option>
          <option value="Non-woven">Non-woven</option>
          <option value="Designer Fabric">✨ Designer Fabric</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fabric Color</label>
        <input class="form-control" id="f-color" placeholder="e.g. Natural, Black">
      </div>
    </div>

    <div class="fabric-detail-wrap" id="primary-fabric-detail" style="margin-top:10px">
      <div class="form-group" style="margin-bottom:0">
        <label>Variation</label>
        <select class="gsm-select" id="f-primary-variation" onchange="onPrimaryVariationChange()"></select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>GSM</label>
        <div class="gsm-wrap">
          <select class="gsm-select" id="f-primary-gsm">
            <option value="">Select GSM…</option>
          </select>
          <span class="gsm-unit">GSM</span>
        </div>
      </div>
    </div>

    <!-- ✨ PATTERN FIELD (Designer Fabric only) -->
    <div class="form-group" style="margin-top:10px;display:none" id="pattern-field-wrap">
      <label>✨ Pattern Name</label>
      <input class="form-control" id="f-pattern" placeholder="e.g. Peacock Paradise, Geometric Flow">
    </div>

    <div class="section-label">Sale By</div>
    <div class="sale-by-grid">
      <div class="sale-by-btn" onclick="selectSaleBy('Sridevi')">Sridevi</div>
      <div class="sale-by-btn" onclick="selectSaleBy('Anu Prasad')">Anu Prasad</div>
      <div class="sale-by-btn" onclick="selectSaleBy('Esha')">Esha</div>
      <div class="sale-by-btn" onclick="selectSaleBy('Other')">Other…</div>
    </div>
    <input class="form-control" id="f-sale-other" placeholder="Enter name…" style="display:none;margin-bottom:14px">

    <button class="btn-submit" onclick="submitOrder()">＋ Add Order</button>
  </div>

  <div class="success-screen" id="success-screen">
    <div class="success-icon">✅</div>
    <div class="success-title">Order Added</div>
    <div class="success-sub">Saved to Google Sheets</div>
    <button class="btn-new-order" onclick="resetForm()">＋ New Order</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbxpcfocezAqlwg37_SujPuDilIyXEeve5A8Niir1vohU3pz2sytBrSIjQyX6vLmoIPN/exec";
const CONFIG_URL="https://script.google.com/macros/s/AKfycbxRr3o5M_bYR3V9oZf2qMH0-Hrp13qP_PcA7h-1KddIPx6TzfMzY6KoYnTMxaa8mnSa/exec";

const FABRIC_CONFIG={'Jute Fabric':{variations:['Half-White','Natural','Oxford Jute','Printed','Colored'],gsm:['14/15','13/13','12/12']},'Cotton Canvas':{variations:['Natural','Colored','Laminated'],gsm:['225','300','310','340','400','490','570']},'Juco Fabric':{variations:['Laminated','Non-Laminated'],gsm:[]},'Kadhi Fabric':{variations:['Natural'],gsm:['90','120','135','150']},'Designer Fabric':{variations:['Kalamkari','Ikat'],gsm:[]}};

let selectedSaleBy='', configData=null;

async function initApp(){
  document.getElementById('live-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  try{const data=await fetch(`${CONFIG_URL}?action=getConfig`).then(r=>r.json());if(data)configData=data;populateConfigDropdowns();}catch(err){console.error(err);}
}

function populateConfigDropdowns(){
  if(!configData)return;
  const prodSel=document.getElementById('f-product');
  if(configData.products){configData.products.forEach(p=>{const opt=document.createElement('option');opt.value=p.name;opt.textContent=p.name;prodSel.appendChild(opt);});}
}

function onPrimaryMaterialChange(){
  const mat=document.getElementById('f-primary-material').value;
  const detailWrap=document.getElementById('primary-fabric-detail');
  const patternWrap=document.getElementById('pattern-field-wrap');
  const varSel=document.getElementById('f-primary-variation');
  const gsmSel=document.getElementById('f-primary-gsm');
  
  varSel.innerHTML='<option value="">Select variation…</option>';
  gsmSel.innerHTML='<option value="">Select GSM…</option>';
  
  // ✨ DESIGNER FABRIC LOGIC
  if(mat==='Designer Fabric'){
    detailWrap.classList.add('visible');
    const kalamkariOpt=document.createElement('option');
    kalamkariOpt.value='Kalamkari';
    kalamkariOpt.textContent='Kalamkari';
    varSel.appendChild(kalamkariOpt);
    const ikatOpt=document.createElement('option');
    ikatOpt.value='Ikat';
    ikatOpt.textContent='Ikat';
    varSel.appendChild(ikatOpt);
    patternWrap.style.display='none';
    return;
  }else{
    patternWrap.style.display='none';
    document.getElementById('f-pattern').value='';
  }
  
  // NORMAL FABRIC LOGIC
  if(FABRIC_CONFIG[mat]){
    const config=FABRIC_CONFIG[mat];
    if(config.variations.length){
      detailWrap.classList.add('visible');
      config.variations.forEach(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=v;varSel.appendChild(opt);});
    }else{detailWrap.classList.remove('visible');}
    if(config.gsm.length){config.gsm.forEach(g=>{const opt=document.createElement('option');opt.value=g;opt.textContent=g+' GSM';gsmSel.appendChild(opt);});}
  }else{detailWrap.classList.remove('visible');}
}

function onPrimaryVariationChange(){
  const mat=document.getElementById('f-primary-material').value;
  const variation=document.getElementById('f-primary-variation').value;
  const patternWrap=document.getElementById('pattern-field-wrap');
  
  if(mat==='Designer Fabric'&&(variation==='Kalamkari'||variation==='Ikat')){
    patternWrap.style.display='block';
  }else{
    patternWrap.style.display='none';
  }
}

function selectSaleBy(v){
  selectedSaleBy=v;
  document.querySelectorAll('.sale-by-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('f-sale-other').style.display=v==='Other'?'block':'none';
}

async function submitOrder(){
  const client=document.getElementById('f-client').value.trim();
  const qty=parseInt(document.getElementById('f-qty').value)||0;
  const orderValue=Number(document.getElementById('f-order-value').value)||0;
  const primaryMaterial=document.getElementById('f-primary-material').value;
  const saleBy=selectedSaleBy==='Other'?document.getElementById('f-sale-other').value.trim():selectedSaleBy;
  
  if(!client||!qty||!orderValue||!primaryMaterial||!saleBy){alert('Fill in all required fields');return;}
  
  const primaryVariation=document.getElementById('f-primary-variation').value;
  const primaryGSM=document.getElementById('f-primary-gsm').value;
  const pattern=document.getElementById('f-pattern')?document.getElementById('f-pattern').value:'';
  
  const order={
    Client:client,
    Product:document.getElementById('f-product').value||'—',
    Qty:qty,
    'Delivery Date':document.getElementById('f-date').value||'',
    'Primary Material':primaryMaterial,
    'Primary Variation':primaryVariation,
    'Primary GSM':primaryGSM,
    Color:document.getElementById('f-color').value||'',
    Pattern:pattern,
    'Order Value':orderValue,
    'Sale By':saleBy,
    'Created At':new Date().toLocaleString()
  };
  
  try{
    const res=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({action:'addOrder',...order})});
    const data=await res.json();
    if(data.success){
      document.getElementById('form-body').style.display='none';
      document.getElementById('success-screen').classList.add('visible');
      showToast('✓ Order saved!');
    }else{showToast('Error: '+data.error);}
  }catch(err){showToast('Error saving order');}
}

function resetForm(){
  document.getElementById('form-body').style.display='block';
  document.getElementById('success-screen').classList.remove('visible');
  ['f-client','f-product','f-qty','f-date','f-order-value','f-color','f-primary-material','f-primary-variation','f-primary-gsm','f-pattern','f-sale-other'].forEach(id=>{document.getElementById(id).value='';});
  selectedSaleBy='';
  document.querySelectorAll('.sale-by-btn').forEach(b=>b.classList.remove('active'));
  onPrimaryMaterialChange();
}

function switchTab(tab){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+tab).classList.add('active');}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

initApp();
</script>

</body>
</html>
